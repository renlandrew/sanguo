<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>动作查看</title>
<style>
  :root { --paper: #ece4d2; --ink: #1d1a17; --ink2: #5b534a; --red: #b23f2a; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 14px "PingFang SC", sans-serif; }
  header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid #c9bfac; }
  button { font: inherit; padding: 6px 12px; border: 1px solid var(--ink2); background: #f6f0e3; border-radius: 4px; cursor: pointer; }
  button.on { background: var(--ink); color: #f6f0e3; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 16px; }
  .card { background: #f6f0e3; border: 1px solid #c9bfac; border-radius: 6px; padding: 10px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  canvas.big { width: 100%; aspect-ratio: 1; background: #ddd3c0; border-radius: 4px; display: block; }
  .strip { display: flex; gap: 2px; margin-top: 6px; overflow-x: auto; }
  .strip canvas { width: 54px; height: 54px; background: #ddd3c0; flex: none; cursor: pointer; border-radius: 2px; }
  .strip canvas.cur { outline: 2px solid var(--red); }
  .note { color: var(--ink2); font-size: 12px; margin-left: auto; }
</style>
</head>
<body>
<header id="who"></header>
<header>
  <button id="slow">放慢 ×4</button><button id="pause">暂停</button>
  <span class="note">每段 8 帧，正常速度每秒 10 帧；点下面的小图停在那一帧</span>
</header>
<main id="main"></main>
<script>
// 动作查看（10-24）：看 img/ 下每张图集里的每段动作，放大循环播放，下面逐帧摊开。
const SETS = { g_guan: '关羽', g_zhang: '张飞', g_liu: '刘备', huangjin: '黄巾兵', lishi: '黄巾力士', gong: '黄巾弓手', cyz: '程远志', yayi: '衙役', dengmao: '邓茂', shushi: '黄巾术士', qibing: '黄巾骑兵', zhangjiao: '张角' };
const NAMES = { idle: '待机', atk: '普攻', skill: '出招', hit: '受击', run: '跑', ram: '撞城', fly: '被打飞', die: '倒地', shoot: '射箭', cast: '施法', summon: '召兵', atk2: '普攻二', atk3: '普攻三' };
const BUST = '?t=' + Date.now();
let cur = new URLSearchParams(location.search).get('k') || 'g_guan', slow = false, paused = false, cards = [];
const who = document.getElementById('who'), main = document.getElementById('main');
for (const [k, n] of Object.entries(SETS)) { const b = document.createElement('button'); b.textContent = n; b.onclick = () => load(k); b.dataset.k = k; who.appendChild(b); }
document.getElementById('slow').onclick = e => { slow = !slow; e.target.classList.toggle('on', slow); };
document.getElementById('pause').onclick = e => { paused = !paused; e.target.classList.toggle('on', paused); };
async function load(k) {
  cur = k; for (const b of who.children) b.classList.toggle('on', b.dataset.k === k);
  const meta = await fetch('img/' + k + '.json' + BUST).then(r => r.json());
  const img = new Image(); img.src = 'img/' + k + '.png' + BUST; await img.decode();
  main.innerHTML = ''; cards = [];
  for (const [anim, A] of Object.entries(meta.anims)) {
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<h3>${NAMES[anim] || anim}（${anim}）</h3>`;
    const big = document.createElement('canvas'); big.className = 'big'; big.width = big.height = 360; card.appendChild(big);
    const strip = document.createElement('div'); strip.className = 'strip'; card.appendChild(strip);
    const W = Math.max(...A.rects.map(r => r[2])), H = Math.max(...A.rects.map(r => r[3]));
    const c = { anim, A, img, big, thumbs: [], f: 0, hold: -1, W, H };
    A.rects.forEach((r, i) => { const t = document.createElement('canvas'); t.width = t.height = 108; draw(t, c, i); t.onclick = () => { c.hold = c.hold === i ? -1 : i; }; strip.appendChild(t); c.thumbs.push(t); });
    main.appendChild(card); cards.push(c);
  }
}
function draw(cv, c, i) {
  const g = cv.getContext('2d'), r = c.A.rects[i], s = Math.min(cv.width / c.W, cv.height / c.H) * .92;
  g.clearRect(0, 0, cv.width, cv.height);
  const ox = (cv.width - c.W * s) / 2, oy = (cv.height - c.H * s) / 2;
  g.drawImage(c.img, r[0], r[1], r[2], r[3], ox, oy, r[2] * s, r[3] * s);
  g.strokeStyle = 'rgba(178,63,42,.5)'; g.beginPath(); g.moveTo(ox + c.A.anchor[0] * s - 6, oy + c.A.anchor[1] * s); g.lineTo(ox + c.A.anchor[0] * s + 6, oy + c.A.anchor[1] * s); g.stroke();   // 脚底锚点
}
let last = performance.now(), acc = 0;
function tick(now) {
  const dt = (now - last) / 1000; last = now;
  if (!paused) acc += dt / (slow ? 4 : 1);
  const step = Math.floor(acc * 10);
  for (const c of cards) {
    const i = c.hold >= 0 ? c.hold : step % c.A.rects.length;
    if (i !== c.f || !c.drawn) { draw(c.big, c, i); c.thumbs.forEach((t, k) => t.classList.toggle('cur', k === i)); c.f = i; c.drawn = true; }
  }
  requestAnimationFrame(tick);
}
load(cur); requestAnimationFrame(tick);
</script>
</body>
</html>
