// 调试：window.__sg（start、sim、auto、turbo）。
(() => {
'use strict';
const W = 360, H = 640, TOP = 78, WALL_Y = 488, HX = 180, GY = 532, SLOT_Y = 558, DT = 1 / 60;
const DUEL_Y = 250;                                    // 斗将时敌将站的位置

const NS = 5;                                          // 出手顺序五格（10-25 用户：「下面最终要放5个武将，军师放红框」）；改五格后站位挪了，30 关 8 种子复核大多在误差内，只有第 18 关潘凤常阵亡，血 7.53→7
const genX = i => 39 + i * 70;                         // 城头五个位置，正对下面五张牌：牌在哪格，人就站在哪格上方
const atkAnim = id => Math.min(.85, GEN[id].atk.cd * .75);   // 城头武将普攻动作演多久（Veo 录像的普攻 12 帧；第三版动作大，最长 0.85 秒）
const BLOOD = '#9a1410', BLOOD_DK = '#5e0a08';
const INK = '#1d1a17', INK2 = '#3b352e', PAPER = '#ece4d2', CINNABAR = '#b23f2a', AZURE = '#3e6e86', JADE = '#2d6a56', OCHRE = '#c8952c';
const FONT = '"Ma Shan Zheng", "STKaiti", "KaiTi", serif', PLAIN = '"PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let S = 1, RS = 1;

// ---------- 随机数 ----------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(1); const br = mulberry(7), vr = mulberry(3);          // rnd 管玩法（同一关每次一样），vr 只管画面
const R = (a, b) => a + (b - a) * rnd(), VR = (a, b) => a + (b - a) * vr(), clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- 笔墨 ----------
const quad = (a, c, b, n = 12) => { const o = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; o.push([u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]); } return o; };
const arcPts = (cx, cy, r, a0, a1, n = 24) => { const o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return o; };
const taper = u => Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.1)), .6);
// 一笔：沿折线画一道墨，宽度按 prof(u) 变（u 是走过的长度比例）
function brush(g, pts, wmax, color, alpha = 1, prof = taper, jit = .14, rr = br) {
  const n = pts.length; if (n < 2) return;
  const L = [0]; for (let i = 1; i < n; i++) L[i] = L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const tot = L[n - 1] || 1, lf = [], rt = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const w = Math.max(0, wmax * prof(L[i] / tot) * (1 + (rr() - .5) * jit)) / 2;
    lf.push([pts[i][0] - dy * w, pts[i][1] + dx * w]); rt.push([pts[i][0] + dy * w, pts[i][1] - dx * w]);
  }
  g.globalAlpha = alpha; g.fillStyle = color; g.beginPath(); g.moveTo(lf[0][0], lf[0][1]);
  for (let i = 1; i < n; i++) g.lineTo(lf[i][0], lf[i][1]);
  for (let i = n - 1; i >= 0; i--) g.lineTo(rt[i][0], rt[i][1]);
  g.closePath(); g.fill(); g.globalAlpha = 1;
}
// 一团墨：边缘不规则的圆
function blot(g, x, y, r, color, alpha = 1, rr = br, k = 12) {
  const p = []; for (let i = 0; i < k; i++) { const a = i / k * Math.PI * 2, q = r * (.78 + rr() * .44); p.push([x + Math.cos(a) * q, y + Math.sin(a) * q]); }
  g.globalAlpha = alpha; g.fillStyle = color; g.beginPath();
  for (let i = 0; i < k; i++) { const a = p[i], b = p[(i + 1) % k], m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; i ? g.quadraticCurveTo(a[0], a[1], m[0], m[1]) : g.moveTo(m[0], m[1]); }
  const a = p[0], b = p[1]; g.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
  g.closePath(); g.fill(); g.globalAlpha = 1;
}
function layer(w, h, draw) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w * RS)); c.height = Math.max(1, Math.ceil(h * RS)); const g = c.getContext('2d'); g.setTransform(RS, 0, 0, RS, 0, 0); draw(g); c.lw = w; c.lh = h; return c; }
function smooth(pts, n = 6) { const o = []; for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)]; for (let k = 0; k < n; k++) { const t = k / n, t2 = t * t, t3 = t2 * t; o.push([0, 1].map(j => .5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3))); } } o.push(pts[pts.length - 1]); return o; }

// ---------- 图 ----------

// 城墙、战场背景（ChatGPT 画的，../工具/make_scene.py 处理）；没有时退回程序画的

for (const m of ['canyon', 'peach', 'camp', 'yamen', 'grass', 'luoyang', 'suanzao', 'sishui', 'hulao', 'ruins']) { const k = 'bg_' + m; IMG[k] = new Image(); IMG[k].src = 'img/' + k + '.jpg' + BUST; }
const SHEETS = {}; for (const k of ['huangjin', 'lishi', 'gong', 'cyz', 'yayi', 'dengmao', 'shushi', 'qibing', 'zhangjiao', 'g_guan', 'g_zhang', 'g_liu', 'xiliang', 'feixiong', 'xianzhen', 'baixing', 'tieqi', 'gongqi', 'langqi', 'huzhen', 'huaxiong', 'lijue', 'gaoshun', 'lvbu', 'panfeng', 'wuanguo']) { IMG[k] = new Image(); IMG[k].src = 'img/' + k + '.png' + BUST; fetch('img/' + k + '.json' + BUST).then(r => r.json()).then(j => { SHEETS[k] = j; }).catch(() => {}); }
let BG, WALL, MIST, GBODY = {}, SPR = {}, SPRHIT = {}, BLOTS = [];
function bakeBg() {
  return layer(W, H, g => {
    g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
    const vg = g.createRadialGradient(W / 2, H * .42, 90, W / 2, H * .42, 440); vg.addColorStop(0, 'rgba(255,250,238,0)'); vg.addColorStop(1, 'rgba(110,90,60,.2)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 1100; i++) { g.globalAlpha = br() * .07; g.fillStyle = INK; g.fillRect(br() * W, br() * H, br() * 1.1, br() * 1.1); }
    g.globalAlpha = 1; g.strokeStyle = 'rgba(90,70,40,.06)'; g.lineWidth = .4;
    for (let i = 0; i < 70; i++) { const x = br() * W, y = br() * H, a = br() * 6.28, l = 8 + br() * 22; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + .5) * l / 2, y + Math.sin(a + .5) * l / 2, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
    // 远山三层
    for (const [base, al, amp] of [[TOP + 6, .1, 46], [TOP + 26, .16, 38], [TOP + 48, .22, 28]]) {
      const pts = []; let x = -20; while (x < W + 30) { pts.push([x, base - br() * amp]); x += 20 + br() * 34; }
      const sp = smooth(pts, 8), grd = g.createLinearGradient(0, base - amp, 0, base + 46);
      grd.addColorStop(0, `rgba(29,26,23,${al})`); grd.addColorStop(1, 'rgba(29,26,23,0)');
      g.fillStyle = grd; g.beginPath(); g.moveTo(-20, base + 46); for (const p of sp) g.lineTo(p[0], p[1]); g.lineTo(W + 30, base + 46); g.closePath(); g.fill();
      brush(g, sp, 2.4, INK, al * 2.2, u => .4 + .6 * Math.sin(u * 40) ** 2, .4);
    }
    // 田野上的淡墨
    for (let i = 0; i < 26; i++) { const x = br() * W, y = TOP + 120 + br() * (WALL_Y - TOP - 140); g.globalAlpha = .035; blot(g, x, y, 14 + br() * 34, INK, .035); }
    for (let i = 0; i < 40; i++) { const x = br() * W, y = TOP + 130 + br() * (WALL_Y - TOP - 140), l = 10 + br() * 26; brush(g, [[x, y], [x + l * .5, y - .6], [x + l, y + .3]], 1.2, INK2, .12); }
    // 大路：从远处汇到城门
    for (const s of [-1, 1]) brush(g, quad([HX + s * 8, TOP + 112], [HX + s * 22, TOP + 260], [HX + s * 52, WALL_Y]), 2.2, INK2, .16, u => .3 + u * .7, .5);
  });
}
function bakeWall() {
  return layer(W, H - WALL_Y + 16, g => {
    const y0 = 14;
    // 城上走道（俯看的石板）
    const fg = g.createLinearGradient(0, y0 + 4, 0, y0 + 70); fg.addColorStop(0, '#c9bfac'); fg.addColorStop(1, '#ddd4c2');
    g.fillStyle = fg; g.fillRect(0, y0 + 4, W, 64);
    for (let r = 0; r < 4; r++) { const y = y0 + 14 + r * 14; brush(g, [[0, y], [W / 2, y + .5], [W, y]], .8, INK2, .18, () => 1, .6); for (let x = (r % 2) * 18; x < W; x += 36) brush(g, [[x, y - 14], [x + .4, y]], .8, INK2, .14, () => 1, .5); }
    for (let i = 0; i < 18; i++) blot(g, br() * W, y0 + 10 + br() * 54, 6 + br() * 12, INK, .05);
    brush(g, [[0, y0 + 68], [W / 2, y0 + 69], [W, y0 + 68]], 3, INK, .7, () => 1, .5);
    // 女墙：一排垛口
    g.fillStyle = INK2; g.globalAlpha = .95; g.fillRect(0, y0 - 2, W, 9); g.globalAlpha = 1;
    for (let x = -6; x < W; x += 30) {
      const w = 20;
      g.fillStyle = INK2; g.fillRect(x, y0 - 13, w, 14);
      g.fillStyle = '#6a6156'; g.fillRect(x + 1, y0 - 13, w - 2, 3.5);
      brush(g, [[x, y0 - 13], [x + w, y0 - 13.4]], 1.6, INK, .9, () => 1, .5);
      brush(g, [[x + w * .3, y0 - 9], [x + w * .32, y0 + 4]], .7, '#000', .35, () => 1, .4);
    }
    brush(g, [[0, y0 + 7], [W / 2, y0 + 7.8], [W, y0 + 7]], 2.4, INK, .9, () => 1, .5);
    for (let i = 0; i < 24; i++) blot(g, br() * W, y0 - 6 + br() * 12, 2 + br() * 5, '#000', .18);
  });
}
// 城头武将的背影（程序画的，以后换 Veo 视频）：关羽绿袍绿巾，张飞黑甲乱发，刘备白袍蓝带
const GLOOK = { guan: { robe: '#4a7563', sash: '#2a4d40', hair: 'scarf' }, zhang: { robe: '#36302a', sash: '#6a5440', hair: 'wild' }, liu: { robe: '#f2ece0', sash: AZURE, hair: 'bun' } };
function bakeGeneral(id) {
  const L = GLOOK[id];
  return layer(44, 64, g => {
    const ox = 22, oy = 60;
    g.globalAlpha = .16; g.fillStyle = INK; g.beginPath(); g.ellipse(ox, oy, 14, 3.8, 0, 0, 6.283); g.fill(); g.globalAlpha = 1;
    g.fillStyle = L.robe; g.beginPath(); g.moveTo(ox - 7, oy - 36); g.quadraticCurveTo(ox - 12, oy - 15, ox - 14.5, oy - 1); g.lineTo(ox + 14.5, oy - 1); g.quadraticCurveTo(ox + 12, oy - 15, ox + 7, oy - 36); g.closePath(); g.fill();
    brush(g, quad([ox - 7, oy - 36], [ox - 12, oy - 16], [ox - 14.5, oy - 1]), 2.4, INK, .88, u => 1 - u * .5);
    brush(g, quad([ox + 7, oy - 36], [ox + 12, oy - 16], [ox + 14.5, oy - 1]), 2.4, INK, .88, u => 1 - u * .5);
    brush(g, [[ox - 14, oy - 1.5], [ox, oy - .5], [ox + 14, oy - 1.5]], 1.6, INK, .7, () => 1, .4);
    brush(g, quad([ox - 2, oy - 28], [ox - 3, oy - 15], [ox - 6, oy - 2]), 1, INK2, .45);
    brush(g, quad([ox + 3, oy - 26], [ox + 4, oy - 13], [ox + 7, oy - 2]), 1, INK2, .45);
    brush(g, [[ox - 9, oy - 23], [ox, oy - 22], [ox + 9, oy - 23]], 3.4, L.sash, .92, () => 1, 0);
    if (id !== 'liu') { blot(g, ox - 9, oy - 34, 4.2, id === 'guan' ? '#2f5747' : INK, .92); blot(g, ox + 9, oy - 34, 4.2, id === 'guan' ? '#2f5747' : INK, .92); }   // 护肩
    brush(g, [[ox - 10.5, oy - 35], [ox, oy - 39], [ox + 10.5, oy - 35]], 4.8, id === 'liu' ? INK2 : L.sash, .88, u => Math.sin(Math.PI * u) ** .4, 0);
    blot(g, ox, oy - 43, 5.8, INK, .96, br, 14);
    if (L.hair === 'scarf') { blot(g, ox, oy - 45, 5.6, '#3d6b58', .95, br, 12); brush(g, quad([ox + 2, oy - 42], [ox + 7, oy - 36], [ox + 6, oy - 28]), 2.4, '#3d6b58', .85, u => 1 - u * .7); }
    else if (L.hair === 'wild') { for (let k = 0; k < 7; k++) { const a = -Math.PI * (.15 + .7 * k / 6); brush(g, [[ox, oy - 45], [ox + Math.cos(a) * 9, oy - 45 + Math.sin(a) * 7]], 2, INK, .9, u => 1 - u); } }
    else { blot(g, ox, oy - 49.5, 3, INK, .96, br, 10); brush(g, [[ox - 5, oy - 50], [ox + 5.5, oy - 49.4]], 1.1, OCHRE, .95, () => 1, 0); }
  });
}

  cyz:   { name: '程远志', hp: 1500, spd: 12, dps: 18, exp: 20, r: 22, box: [76, 96], s: 1.9, wpn: 'blade', bulk: 11, boss: true, sheet: 'cyz', sh: 70, title: '黄巾大将' },
  // 第一章新兵种（10-24，见 ../设计/第一章设定.md 3.1）

  shushi: { name: '黄巾术士', hp: 48, spd: 26, leak: 2, exp: 3, r: 9, box: [34, 52], s: 1, wpn: 'bow', sheet: 'shushi', sh: 44, heal: { every: 5, r: 80, pct: .2 } },

  yayi:   { name: '衙役', hp: 22, spd: 40, leak: 1, exp: 1, r: 9, box: [34, 52], s: 1, wpn: 'club', sheet: 'yayi', sh: 40, zig: true },
