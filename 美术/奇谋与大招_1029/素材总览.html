<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>深堑、大招特写与奇谋卡</title><style>body{background:#161411;color:#eadabe;font:16px system-ui;margin:32px}h1,h2{color:#e5c98c}section{margin:36px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}.card{background:#28211b;border:1px solid #6e5b3a;border-radius:10px;overflow:hidden}.card img{display:block;width:100%;height:auto}.name{padding:10px 14px}.transparent{background:repeating-conic-gradient(#ddd 0 25%,#aaa 0 50%) 0 / 22px 22px}.wide img{max-width:100%;display:block;margin:10px auto;background:repeating-conic-gradient(#ddd 0 25%,#aaa 0 50%) 0 / 22px 22px}.wide figure{margin:16px 0}.wide figcaption{margin:8px 0}</style><h1>深堑、大招特写与奇谋卡</h1><p>画稿预览；比例和视觉效果尚待游戏内校验。</p><section><h2>战场与通用素材</h2><div id="props" class="wide"></div></section><section><h2>大招眼部特写</h2><div id="eyes" class="wide"></div></section><section><h2>奇谋卡插画</h2><div id="cards" class="grid"></div></section><script>
const props=['卢植_深堑','黑色笔刷','朱红笔刷','奇谋卡框'], eyes=['关羽','张飞','刘备'], cards=['青龙斩','温酒斩将','当阳一喝','丈八破阵','双股剑','仁德护阵','伏兵','缓兵之计','凿堑','将计就计','敌_伏兵','敌_火箭','敌_离间','敌_激将','敌_急行','敌_援军','敌_妖术回春'];
for(const [id,folder,items] of [['props','通用素材',props],['eyes','眼部特写',eyes],['cards','奇谋卡',cards]]){const target=document.getElementById(id);for(const name of items){const el=document.createElement(id==='cards'?'div':'figure');el.className=id==='cards'?'card':'';const img=document.createElement('img');img.src=folder+'/'+name+'.png';img.alt=name;if(name==='奇谋卡框')img.className='transparent';el.append(img);const label=document.createElement(id==='cards'?'div':'figcaption');label.className='name';label.textContent=name;el.append(label);target.append(el)}}
</script></html>
