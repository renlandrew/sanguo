const cvPt = ev => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) / S, (ev.clientY - r.top) / S]; };
cv.addEventListener('pointermove', ev => { if (G && G.drag) { [G.drag.x, G.drag.y] = cvPt(ev); } });   // 拖着底栏的牌
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, e => { if (G && G.drag) { const D = G.drag; G.drag = null; if (e.type === 'pointerup' && G.state === 'play') { const [x, y] = cvPt(e), j = slotAt(x, y); if (j >= 0 && j !== D.i) { swapSlots(D.i, j); sfx('tap'); } } return; }   // 松手：落在另一张上就换，落别处不动，都不出招
  const P = PRESS; if (!P) return; PRESS = null; clearTimeout(P.tm); if (e.type === 'pointerup') { sfx('tap'); P.h.fn(); } });
cv.addEventListener('pointermove', ev => {   // 电脑上鼠标停在城墙军械图标上：显示说明
  if (ev.pointerType !== 'mouse' || !G || !G.propRects) return; const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / S, y = (ev.clientY - r.top) / S;
  const h = G.propRects.find(([px, py, w, hh]) => x >= px && x <= px + w && y >= py && y <= py + hh);
  if (h) G.propTip = { ...h[4], x: h[0] + h[2] / 2, y: h[1] + 2, t0: uiNow(), hover: true }; else if (G.propTip && G.propTip.hover) G.propTip = null;
});
cv.addEventListener('pointerdown', ev => {
  if (G && G.ult) return;
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) / S, y = (ev.clientY - r.top) / S;
  sndInit();
  if (G && G.teach) { closeTeach(); return; }                                       // 教学说明：点哪都是继续
  for (let i = HITS.length - 1; i >= 0; i--) { const h = HITS[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
    if (h.long) { const P = PRESS = { h, tm: setTimeout(() => { if (PRESS === P) { PRESS = null; sfx('tap'); h.long(); } }, 450) }; return; }   // 有长按的：按住满 0.45 秒算长按，早松手算点
    sfx('tap'); h.fn(); return; } }
  if (G && (G.paused || G.panel)) return;
  if (G && G.state === 'play' && y > TOP && y < WALL_Y + 10) {
    if (G.logArm) { fireLog(x); return; }
    if (G.nuArm) { fireNu(x); return; }
    if (G.lightArm) { placeLight(x, y); return; }
    if (G.decoyArm) { placeDecoy(x, y); return; }
    if (G.wells) { const w = G.wells.find(w => Math.hypot(w.x - x, w.y - 8 - y) < 22); if (w) { tapWell(w); return; } }
    let best = null, bd = 26; for (const e of G.foes) { const d = Math.hypot(e.x - x, e.y - 10 - y); if (d < bd) { bd = d; best = e; } }
    if (best && seen(best)) { if (G.pickHero) { (G.focusBy = G.focusBy || {})[G.pickHero] = best; G.pickHero = null; } else { G.focus = best; G.focusBy = {}; } }   // 先点城头某员武将再点敌人：只给他标；直接点敌人：三人一起盯
  }
});

// ---------- 调试接口 ----------
window.__sg = {
  auto: false, turbo: 1, all: new URLSearchParams(location.search).has('all'), seed: 0,   // 网址带 ?all 就十关全开（试玩用）
  tune: TUNE, PERKS, GEN, LEVELS, WAVE, TIMEX, MER, RANK_AT, setSpd(v) { SPD.v = SPD_X = v; ACT_X = 1 / v; }, get G() { return G; }, draw: () => render(),            // draw：面板藏着时浏览器不跑动画帧，截图前手动画一帧 get screen() { return screen; },
  start: i => startLevel(i), up: (k, who) => doUp(k, who), open: i => openLevel(i), get prep() { return PREP; }, set prep(v) { PREP = v; }, get screen() { return screen; }, get ml() { return [ML, MLB]; }, get snd() { return { SND, MP }; }, spPlay: (...a) => spPlay(...a), get feats() { return G && G.feats; }, get cnt() { return G && G.cnt; },
  // 军师荐得对不对：机器人照真值打，每次晋升让三位军师各荐一次，数荐中真值最高那张的次数（10-25）
  advTest(levels, seeds = 2) { const out = {};
    for (const i of levels) for (let k = 0; k < seeds; k++) { this.seed = k * 101; this.auto = true; this.simming = true; startLevel(i); this.simming = false; G.sim = true; let n = 0;
      while (G.state !== 'over' && G.t < 400 && n < 1e6) { if (G.state === 'pick') { const I = foeIntel(), tv = G.pick.map(p => perkEval(p, I).v), tb = tv.indexOf(Math.max(...tv));
          if (tv[tb] - Math.min(...tv) >= 100) for (const ck of Object.keys(COUNSEL)) { this.forceC = ck; const a = counselAdvise(G.pick), key = ck + (i < 10 ? '·黄巾' : '·董卓'); out[key] = out[key] || [0, 0]; out[key][1]++; if (tv[tb] - tv[a.i] >= 100) out[key][0]++; }   /* 只数有好坏之分的：荐了差 100 以上的算荐错 */
          this.forceC = null; takePerk(autoPick()); } else step(DT); n++; } }
    this.seed = 0; this.auto = false; return Object.fromEntries(Object.entries(out).map(([k, [a, b]]) => [k, '荐错 ' + Math.round(a / b * 100) + '% (' + b + ')'])); }, ult: (k, foe) => playUlt(k, foe, true), get inv() { return INV; }, get daily() { return DAILY; }, dayOff: 0, tick: () => dailyTick(), gateLack: id => gateLack(id), nextGate: () => nextGate(), get scr() { return screen; }, set scr(v) { screen = v; },
  // 不画面，直接跑：一直到这一关结束（auto 时自动选战法），返回结果
  sim(i, maxT = 300) { this.auto = true; this.simming = true; startLevel(i); this.simming = false; G.sim = true; let n = 0; while (G.state !== 'over' && G.t < maxT && n < 1e6) { if (G.state === 'pick') takePerk(autoPick()); if (this.hook) this.hook(G); step(DT); n++; } return { win: G.result && G.result.win, stars: G.result && G.result.stars, wall: Math.round(G.wall), t: Math.round(G.t), killed: G.killed, leaked: G.leaked, total: G.total, rank: G.rank, perks: G.perks }; },
  // 每关换 n 个种子各跑一遍：平均星数、胜场、城防、用时、撞城的兵、输的原因（调平衡用）
  bench(levels = LEVELS.map((_, i) => i), n = 6, naive = false) {
    const out = []; this.naive = naive;
    for (const i of levels) { let st = 0, w = 0, wall = 0, t = 0, lk = 0, rk = 0; const why = {};
      for (let k = 0; k < n; k++) { this.seed = k * 101; const r = this.sim(i, 400); st += r.stars || 0; w += r.win ? 1 : 0; wall += r.wall; t += r.t; lk += r.leaked; rk += r.rank; const y = G.result && G.result.why; if (y) why[y] = (why[y] || 0) + 1; }
      out.push(`${i + 1}${naive ? ' 乱选' : ''} 星 ${(st / n).toFixed(2)} 胜 ${w}/${n} 城 ${Math.round(wall / n)} 秒 ${Math.round(t / n)} 漏 ${Math.round(lk / n)} 晋 ${(rk / n).toFixed(1)} ${Object.entries(why).map(([a, b]) => a + b).join(' ')}`); }
    this.seed = 0; this.naive = false; return out.join('\n');
  },
  // 每关军功 MER 重测（10-25 夜）：机器人会搭配、按推荐等级跑 n 个种子，军功平均除以魅力系数；斗将不算最后斩敌将那一下。返回字符串，抄回 MER
  note: (got = { 精铁: 2 }, packs = 1) => { MENU.note = { got, packs, t0: uiNow() }; },   // 点卯横幅（截图核对用）
  goals: i => goalLines(LEVELS[i], null).map(x => x.join(' ')),   // 各关目标（核对用）
  story(k, i = 0) { playStory(k, () => { screen = 'menu'; }); STP.i = i; STP.t0 = -99; STP.prev = null; },   // 看某场剧情的第 i 句（截图核对用；会记成看过，用测试档）
  merTest(levels = LEVELS.map((_, i) => i), n = 6) { const out = {};
    for (const i of levels) { let m = 0, nm = 1; for (let k = 0; k < n; k++) { this.seed = k * 101; const r = this.sim(i, 400); let got = G.exp; for (let q = 0; q < G.rank; q++) got += needOf(q);
        if (G.duel && r.win) got -= FOES[G.lv.boss].exp; m += got; nm = G.needMul; } out[LEVELS[i].id] = Math.round(m / n / nm); }
    this.seed = 0; return JSON.stringify(out); },
  pick: i => takePerk(i), step: n => { for (let k = 0; k < n; k++) { if (G.state === 'pick' && window.__sg.auto) takePerk(autoPick()); step(DT); } },
  // 一直跑到某种特效刚出来 at 秒（截图用）
  until(kind, at = .1, maxN = 20000) { const old = new Set(G.fx); for (let k = 0; k < maxN; k++) { if (G.state === 'pick') takePerk(autoPick()); step(DT); const f = G.fx.find(f => f.k === kind && !old.has(f)); if (f && f.t >= at) return true; } return false; }, get mem() { const r = [...ALLIMG].map(w => w.deref()).filter(im => im && im.complete && im.naturalWidth).map(im => [(im._url || '').split('/').pop().split('?')[0], im.naturalWidth * im.naturalHeight * 4 / 1e6]).concat(Object.entries(SHEET_C).map(([k, e]) => ['画布 ' + k, e.c.width * e.c.height * 4 / 1e6])).sort((a, b) => b[1] - a[1]); const cvs = ALLCV.map(w => w.deref()).filter(c => c && c.width * c.height > 1).map(c => c.width * c.height * 4 / 1e6); return { cvN: cvs.length, cvMB: Math.round(cvs.reduce((a, b) => a + b, 0)), cvTop: ALLCV.map(w => w.deref()).filter(c => c && c.width * c.height > 250000).map(c => c.width + 'x' + c.height + '@' + c._at), MB: Math.round(r.reduce((a, b) => a + b[1], 0)), top: r.slice(0, 25).map(([k, v]) => k + ' ' + v.toFixed(0)) }; }, get woken() { return [...WOKEN].map(im => (im._url || '').split('/').pop().split('?')[0]); },   // 调试：换关后留在内存里的大图
  tap: (x, y) => cv.dispatchEvent(new PointerEvent('pointerdown', { clientX: cv.getBoundingClientRect().left + x * S, clientY: cv.getBoundingClientRect().top + y * S })),
};

// ---------- 主循环 ----------
let last = performance.now(), acc = 0;
function frame(now) {
  const d = Math.min(.1, (now - last) / 1000); last = now;
  acc += d * (window.__sg.turbo ?? 1) * (G && screen === 'play' && G.state === 'play' && spdOpen() ? INV.spd || 1 : 1); let n = 0;   // 二倍速：每帧多推一倍       // turbo = 0 就停住（截图用）
  while (acc >= DT && n < 600) { if (G) step(DT); acc -= DT; n++; }
  render(); bgMirror(); requestAnimationFrame(frame);
  if (now - aliveT > 2000) { aliveT = now; aliveMark(); }
}
// 中断记录（10-30 用户：「我第五关一直没能打完就自动刷新页面」）：每两秒记一下在哪关第几秒、图片占多少；正常关页面、切到后台会擦掉，
// 剩下的就是被系统杀掉重开的——下次进主页提示一行，让用户截图回来
let aliveT = 0; const CRASH = (() => { try { const j = JSON.parse(localStorage.getItem('sgz.alive') || 'null'); localStorage.removeItem('sgz.alive'); return j && Date.now() - j.at < 15 * 60e3 ? j : null; } catch (e) { return null; } })();
function aliveMark() { if (document.hidden) return; try { let mb = 0; for (const w of ALLIMG) { const im = w.deref(); if (im && im.complete && im.naturalWidth) mb += im.naturalWidth * im.naturalHeight * 4e-6; }
  localStorage.setItem('sgz.alive', JSON.stringify({ at: Date.now(), scr: screen, lv: G && G.lv ? G.lv.id : 0, t: G ? Math.round(G.t || 0) : 0, mb: Math.round(mb) })); } catch (e) {} }
const aliveClear = () => { try { localStorage.removeItem('sgz.alive'); } catch (e) {} };
addEventListener('pagehide', aliveClear); document.addEventListener('visibilitychange', () => { if (document.hidden) aliveClear(); });
const BGV = document.getElementById('bgv'), BGX = BGV.getContext('2d'); let bgTick = 0;
function bgMirror() { const wide = innerWidth > W * S + 2; if (BGV.style.display !== (wide ? '' : 'none')) BGV.style.display = wide ? '' : 'none'; if (!wide || (bgTick++ & 3)) return;   /* 10-27 手机上变糊：全屏加模糊滤镜的底层画布让手机浏览器把整页降了清晰度，窄屏直接不显示 */ BGX.drawImage(cv, 0, 0, 36, 64); }   // 宽屏才画，每 4 帧缩成 36×64 一次，放大加模糊就够当底
function boot() { fit(); addEventListener('resize', fit); if (new URLSearchParams(location.search).has('story')) playStory('open', () => { screen = 'menu'; }, true);   /* 网址带 ?story：直接从序章开始翻看第一章全部剧情（10-26 用户：「你专门开个故事我看看，可以来回翻动的」） */
  requestAnimationFrame(frame); }
function fit() {
  S = Math.min(innerWidth / W, innerHeight / H) || 1; if (S <= 0) S = 1; const dpr = Math.min(2, devicePixelRatio || 1); RS = S * dpr;   // 10-30 上限 3 → 2：三倍屏手机像素少一半多，看不出差别
  cv.width = Math.round(W * RS); cv.height = Math.round(H * RS); cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
  cv.style.marginTop = Math.max(0, (innerHeight - H * S) / 2) + 'px'; bakeAll(); spxInit();
  if (ML === null && window.Moliu) ML = Moliu.create({ W, H, pw: cv.width, ph: cv.height, paintImg: IMG.paint }) || false;
  if (MLB === null && window.Moliu) { MLB = Moliu.create({ W, H, pw: cv.width, ph: cv.height, paintImg: IMG.paint }) || false; if (MLB) { MLB.cfg.palette = 'ink';   /* 10-26 试过紫金妖气，用户：「算了，你就保留之前墨烟吧」 */ MLB.cfg.decay = [.9, 3.6, .85, 2.2]; } }
}
(document.fonts ? Promise.race([document.fonts.load('40px "Ma Shan Zheng"'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve()).then(boot, boot);
})();
